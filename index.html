<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomoro Coffee WiFi</title>

  <link rel="icon" href="images/icon.png">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #3e2723, #1b1b1b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.05);
      padding: 24px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 380px;
    }

    .logo {
      width: 130px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0;
      font-size: 22px;
    }

    .desc {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .wifi-box {
      background: rgba(255,255,255,0.08);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    button {
      padding: 14px;
      border: none;
      border-radius: 999px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    .primary {
      background: #ff7a3d;
      color: white;
      font-weight: bold;
    }

    .secondary {
      background: #ffffff10;
      color: white;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .footer {
      font-size: 11px;
      opacity: 0.5;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .footer-icon {
      width: 25px;
      height: 25px;
    }

    .popup {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);

  display: none;
  justify-content: center;
  align-items: center;
}

/* CONTAINER */
.popup-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* GAMBAR */
.popup-content img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain; /* penting biar nggak kepotong */
  border-radius: 12px;
}

/* CLOSE BUTTON */
.close {
  position: absolute;
  top: -15px;
  right: -15px;
  background: #ff7a3d;
  color: white;
  font-size: 18px;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  cursor: pointer;
}
  </style>
</head>

<body>

  <div class="container">

    <img src="images/tomoro.png" class="logo">

    <h1>Free WiFi Access</h1>

    <div class="desc">
      Cukup dengan 1 cup, Anda sudah ikut mendukung kenyamanan WiFi di Tomoro Coffee ☕
    </div>

    <div class="wifi-box">
      <p><strong>SSID:</strong> Tommunity Mulyosari</p>
      <p><strong>Password:</strong> <span id="pass">TerimaKasih</span></p>
      <button class="secondary" onclick="copyPassword()">Copy Password</button>
    </div>

    <button class="primary" onclick="connectWifi()">Connect WiFi</button>

    <button class="secondary" onclick="openPopup()">
      Bundling Mahasiswa Ber-5
      </button>

    <div class="footer">
      <img src="images/favicon.png" class="footer-icon">
      Powered by Tomoro Coffee - Mulyosari
    </div>

  </div>

  <script>
    function connectWifi() {
      const ua = navigator.userAgent.toLowerCase();

      if (ua.includes("android")) {
        window.location.href = "intent:#Intent;action=android.settings.WIFI_SETTINGS;end";
      } else if (ua.includes("iphone")) {
        alert("Buka Settings > WiFi lalu pilih jaringan.");
      } else {
        alert("Silakan buka pengaturan WiFi.");
      }
    }

    function copyPassword() {
      const password = document.getElementById("pass").innerText;
      navigator.clipboard.writeText(password);
      alert("Password berhasil di-copy!");
    }
    function openPopup() {
  document.getElementById("popup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("popup").style.display = "none";
    }
  </script>

  <!-- POPUP PROMO -->
<div id="popup" class="popup">
  <div class="popup-content">
    
    <span class="close" onclick="closePopup()">&times;</span>

    <img src="images/bundling.png" alt="Promo">

  </div>
</div>
</body>
</html>
